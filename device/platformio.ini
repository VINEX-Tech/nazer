; NAZER Firmware: PlatformIO Configuration
; Board: ESP32-WROOM-32 (30-pin, CP2102)
; Framework: Arduino

[env:nazer_esp32]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 115200

board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

; lib_ldf_mode = deep: required for transitive framework header resolution
; (Transport includes Storage which includes Preferences.h)
lib_ldf_mode = deep

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
    -I include

lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    electroniccats/MPU6050@^1.3.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0
    bblanchon/ArduinoJson@^7.0.0
    ; WiFi, BLE, HTTPClient, Preferences: all built into ESP32 Arduino framework

; ================================================================
; PHASE 7: Full Integration (src/main.cpp)
; ================================================================
; NO build_src_filter line = PlatformIO compiles src/main.cpp by default.
; This is the normal state: the main firmware.
;
; To go back to a test sketch, uncomment ONE of the lines below:
;
; build_src_filter = -<*> +<../test/test_display_encoder.cpp>
; build_src_filter = -<*> +<../test/test_gps.cpp>
; build_src_filter = -<*> +<../test/test_imu.cpp>
; build_src_filter = -<*> +<../test/test_fusion.cpp>
; build_src_filter = -<*> +<../test/test_wifi.cpp>
; build_src_filter = -<*> +<../test/test_ble.cpp>
; build_src_filter = -<*> +<../test/test_storage.cpp>
; build_src_filter = -<*> +<../test/test_transport_full.cpp>
; build_src_filter = -<*> +<../test/test_gsm.cpp>
; build_src_filter = -<*> +<../test/test_ble_integration.cpp>

; Hardware bring-up: tests every module. Build/flash with `pio run -e bringup -t upload`.
[env:bringup]
extends = env:nazer_esp32
build_src_filter = -<*> +<../test/test_bringup.cpp>
