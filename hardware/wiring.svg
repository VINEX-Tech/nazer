<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Nazer prototype wiring</title>
  <rect width="1000" height="640" fill="#ffffff"/>
  <style>
    .box{fill:#f4f6f8;stroke:#1f2328;stroke-width:1.6}
    .mcu{fill:#e8f1fb;stroke:#1f4e8c;stroke-width:2}
    .pwr{fill:#fdf1e7;stroke:#9a4a12;stroke-width:1.6}
    .t{fill:#1f2328}
    .h{font-weight:bold;font-size:15px;fill:#1f2328}
    .s{font-size:11px;fill:#57606a}
    .sig{stroke:#1f4e8c;stroke-width:1.6;fill:none}
    .i2c{stroke:#1a7f37;stroke-width:1.6;fill:none}
    .gsm{stroke:#8250df;stroke-width:1.6;fill:none}
    .v33{stroke:#cf222e;stroke-width:2;fill:none}
    .v4{stroke:#bc4c00;stroke-width:2;fill:none}
    .bat{stroke:#6e7781;stroke-width:2;fill:none}
    .gnd{stroke:#1f2328;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
  </style>

  <text x="24" y="34" class="h" font-size="18">Nazer prototype: wiring</text>
  <text x="24" y="54" class="s">Signal pins from device/include/config.example.h. Power parts from device/README.md. All grounds are common.</text>

  <!-- ESP32 -->
  <rect x="400" y="110" width="200" height="330" rx="8" class="mcu"/>
  <text x="500" y="136" text-anchor="middle" class="h">ESP32-WROOM-32</text>
  <text x="500" y="152" text-anchor="middle" class="s">DevKit, 30-pin, WiFi + BLE</text>
  <!-- left pins -->
  <text x="410" y="190" class="t">GPIO4 (RX1)</text>
  <text x="410" y="220" class="t">GPIO5 (TX1)</text>
  <text x="410" y="300" class="t">GPIO21 (SDA)</text>
  <text x="410" y="330" class="t">GPIO22 (SCL)</text>
  <text x="410" y="410" class="t">3V3 / GND</text>
  <!-- right pins -->
  <text x="590" y="190" text-anchor="end" class="t">GPIO16 (RX2)</text>
  <text x="590" y="220" text-anchor="end" class="t">GPIO17 (TX2)</text>
  <text x="590" y="250" text-anchor="end" class="t">GPIO25 (RST)</text>
  <text x="590" y="280" text-anchor="end" class="t">GPIO33 (PWRKEY)</text>
  <text x="590" y="350" text-anchor="end" class="t">GPIO2 (status LED)</text>
  <text x="590" y="380" text-anchor="end" class="s">GPIO36 battery ADC, divider not fitted</text>

  <!-- GPS -->
  <rect x="60" y="120" width="190" height="126" rx="8" class="box"/>
  <text x="155" y="144" text-anchor="middle" class="h">GPS</text>
  <text x="155" y="161" text-anchor="middle" class="s">Ai-Thinker GP-02, 9600 baud</text>
  <text x="240" y="190" text-anchor="end" class="t">TX</text>
  <text x="240" y="220" text-anchor="end" class="t">RX</text>
  <path d="M250 186 H400" class="sig"/><polygon points="392,182 400,186 392,190" fill="#1f4e8c"/>
  <path d="M400 216 H250" class="sig"/><polygon points="258,212 250,216 258,220" fill="#1f4e8c"/>
  <text x="70" y="236" class="s">VCC 3.3 V, GND</text>

  <!-- IMU -->
  <rect x="60" y="256" width="190" height="112" rx="8" class="box"/>
  <text x="155" y="276" text-anchor="middle" class="h">IMU</text>
  <text x="155" y="291" text-anchor="middle" class="s">MPU-6050 (GY-521)</text>
  <text x="240" y="300" text-anchor="end" class="t">SDA</text>
  <text x="240" y="330" text-anchor="end" class="t">SCL</text>
  <path d="M250 296 H400" class="i2c"/>
  <path d="M250 326 H400" class="i2c"/>
  <text x="70" y="356" class="s">I2C 0x68, VCC 3.3 V, AD0 to GND</text>

  <!-- SIM800L -->
  <rect x="750" y="120" width="200" height="190" rx="8" class="box"/>
  <text x="850" y="144" text-anchor="middle" class="h">GSM modem</text>
  <text x="850" y="161" text-anchor="middle" class="s">SIM800L, GPRS, 9600 baud</text>
  <text x="760" y="190" class="t">TxD</text>
  <text x="760" y="220" class="t">RxD</text>
  <text x="760" y="250" class="t">RST</text>
  <text x="760" y="280" class="t">PWRKEY</text>
  <path d="M750 186 H600" class="gsm"/><polygon points="608,182 600,186 608,190" fill="#8250df"/>
  <path d="M600 216 H750" class="gsm"/><polygon points="742,212 750,216 742,220" fill="#8250df"/>
  <path d="M600 246 H750" class="gsm"/><polygon points="742,242 750,246 742,250" fill="#8250df"/>
  <path d="M600 276 H750" class="gsm"/><polygon points="742,272 750,276 742,280" fill="#8250df"/>
  <text x="850" y="302" text-anchor="middle" class="s">VCC 4.0 V, large capacitor at the pins</text>
  <!-- antenna -->
  <path d="M950 140 H975 V100" class="bat"/>
  <path d="M965 100 L975 80 L985 100 Z" fill="#1f2328"/>
  <text x="992" y="72" text-anchor="end" class="s">RP-SMA antenna</text>

  <!-- Power chain -->
  <rect x="60" y="500" width="120" height="70" rx="8" class="pwr"/>
  <text x="120" y="528" text-anchor="middle" class="h">USB-C</text>
  <text x="120" y="546" text-anchor="middle" class="s">charge port</text>

  <rect x="220" y="500" width="140" height="70" rx="8" class="pwr"/>
  <text x="290" y="528" text-anchor="middle" class="h">TP4056</text>
  <text x="290" y="546" text-anchor="middle" class="s">Li-ion charger</text>

  <rect x="220" y="590" width="140" height="40" rx="8" class="pwr"/>
  <text x="290" y="615" text-anchor="middle" class="t">18650 cell</text>

  <rect x="400" y="500" width="110" height="70" rx="8" class="pwr"/>
  <text x="455" y="528" text-anchor="middle" class="h">Switch</text>
  <text x="455" y="546" text-anchor="middle" class="s">slide, on/off</text>

  <rect x="560" y="470" width="150" height="60" rx="8" class="pwr"/>
  <text x="635" y="496" text-anchor="middle" class="h">Mini-360 buck</text>
  <text x="635" y="514" text-anchor="middle" class="s">3.3 V rail</text>

  <rect x="560" y="550" width="150" height="60" rx="8" class="pwr"/>
  <text x="635" y="576" text-anchor="middle" class="h">MT3608 boost</text>
  <text x="635" y="594" text-anchor="middle" class="s">4.0 V for the modem</text>

  <path d="M180 535 H220" class="bat"/>
  <path d="M290 570 V590" class="bat"/>
  <path d="M360 535 H400" class="bat"/>
  <path d="M510 535 H535 V500 H560" class="bat"/>
  <path d="M535 535 V580 H560" class="bat"/>
  <!-- 3.3 V rail -->
  <path d="M710 500 H730 V455 H330" class="v33"/>
  <path d="M380 455 V420 H400" class="v33"/>
  <path d="M380 455 V226 H330 V236 H250" class="v33"/>
  <path d="M330 455 V356 H250" class="v33"/>
  <!-- 4.0 V to modem -->
  <path d="M710 580 H980 V290 H950" class="v4"/>

  <!-- legend -->
  <g transform="translate(760,350)">
    <rect width="210" height="100" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <path d="M12 20 H42" class="sig"/><text x="50" y="24" class="s">GPS UART1</text>
    <path d="M12 38 H42" class="i2c"/><text x="50" y="42" class="s">I2C bus</text>
    <path d="M12 56 H42" class="gsm"/><text x="50" y="60" class="s">Modem UART2 and control</text>
    <path d="M12 74 H42" class="v33"/><text x="50" y="78" class="s">3.3 V rail</text>
    <path d="M12 92 H42" class="v4"/><text x="50" y="96" class="s">4.0 V modem supply</text>
  </g>
</svg>
